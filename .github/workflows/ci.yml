name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: viagens_test
          POSTGRES_PASSWORD: viagens_test
          POSTGRES_DB: viagens_activity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run test:db
      - run: npm run test:db:concurrency
        env:
          DATABASE_TEST_URL: postgresql://viagens_test:viagens_test@127.0.0.1:5432/viagens_activity_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
